<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EventHub - Digital Ticket
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="dashboard-body">

<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub
        </a>


        <a
            href="bookings.html"
            class="btn logout-btn"
        >
            My Bookings
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="booking-card">

                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        Digital Ticket
                    </h2>

                    <p class="text-muted">
                        Present this ticket at the event.
                    </p>

                </div>


                <div id="ticketContent">

                    <div class="mb-3">

                        <strong>
                            Event
                        </strong>

                        <p id="eventName">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>
                            Booking ID
                        </strong>

                        <p id="bookingId">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>
                            Event Date
                        </strong>

                        <p id="eventDate">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>
                            Venue
                        </strong>

                        <p id="venueName">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>
                            Quantity
                        </strong>

                        <p id="quantity">
                            -
                        </p>

                    </div>


                    <div class="mb-3">

                        <strong>
                            Booking Status
                        </strong>

                        <p>

                            <span
                                id="bookingStatus"
                                class="badge bg-success"
                            >
                                CONFIRMED
                            </span>

                        </p>

                    </div>


                    <hr>


                    <div class="text-center">

                        <h5 class="fw-bold mb-3">
                            QR Code
                        </h5>


                        <img
                            id="qrCode"
                            src=""
                            alt="Digital Ticket QR Code"
                            width="220"
                            height="220"
                        >


                        <p
                            id="ticketCode"
                            class="text-muted mt-3"
                        >
                        </p>

                    </div>

                </div>


                <p
                    id="message"
                    class="text-center mt-3"
                >
                </p>

            </div>

        </div>

    </div>

</div>


<script>

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");

const selectedBookingId =
    localStorage.getItem(
        "selected_booking_id"
    );


if (!token) {

    window.location.href =
        "../login.html";
}


if (role !== "CUSTOMER") {

    alert("Access denied");

    window.location.href =
        "../login.html";
}


if (!selectedBookingId) {

    alert("No booking selected");

    window.location.href =
        "bookings.html";
}


/* =========================
   LOAD DIGITAL TICKET
========================= */

async function loadTicket() {

    const message =
        document.getElementById(
            "message"
        );


    try {

        const response =
            await fetch(
                "http://localhost/event_ticketing_system/api/bookings/",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const bookings =
            await response.json();


        if (!response.ok) {

            message.innerText =
                bookings.message ||
                "Unable to load ticket.";

            message.className =
                "text-danger text-center mt-3";

            return;
        }


        const booking =
            bookings.find(
                item =>
                    item.booking_id ==
                    selectedBookingId
            );


        if (!booking) {

            message.innerText =
                "Booking not found.";

            message.className =
                "text-danger text-center mt-3";

            return;
        }


        /* ONLY CONFIRMED BOOKINGS */

        if (
            booking.booking_status !==
            "CONFIRMED"
        ) {

            document.getElementById(
                "ticketContent"
            ).style.display =
                "none";


            message.innerText =
                "Digital ticket is only available for confirmed bookings.";

            message.className =
                "text-danger text-center mt-3";

            return;
        }


        /* DISPLAY BOOKING DETAILS */

        document.getElementById(
            "eventName"
        ).innerText =
            booking.event_name;


        document.getElementById(
            "bookingId"
        ).innerText =
            "#" + booking.booking_id;


        document.getElementById(
            "quantity"
        ).innerText =
            booking.quantity;


        document.getElementById(
            "bookingStatus"
        ).innerText =
            booking.booking_status;


        /*
            These values require the bookings API
            to return event_date and venue_name.
        */

        document.getElementById(
            "eventDate"
        ).innerText =
            booking.event_date || "-";


        document.getElementById(
            "venueName"
        ).innerText =
            booking.venue_name || "-";


        /* CREATE TICKET CODE */

        const ticketCode =
            "EVENTHUB-B" +
            booking.booking_id +
            "-E" +
            booking.event_id;


        document.getElementById(
            "ticketCode"
        ).innerText =
            "Ticket Code: " +
            ticketCode;


        /*
            QR DATA
        */

        const qrData =
            "Booking ID: " +
            booking.booking_id +
            "\nEvent ID: " +
            booking.event_id +
            "\nTicket Code: " +
            ticketCode;


        /*
            EXTERNAL QR API
        */

        const qrUrl =
            "https://api.qrserver.com/v1/create-qr-code/" +
            "?size=220x220" +
            "&data=" +
            encodeURIComponent(
                qrData
            );


        document.getElementById(
            "qrCode"
        ).src =
            qrUrl;

    }

    catch (error) {

        console.error(error);


        message.innerText =
            "Unable to load digital ticket.";

        message.className =
            "text-danger text-center mt-3";
    }
}


loadTicket();

</script>

</body>

</html>
