<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - My Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub
        </a>

        <a
            href="dashboard.html"
            class="btn logout-btn"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="booking-card">

                <h2 class="fw-bold mb-4">
                    My Account
                </h2>


                <!-- NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        id="accountName"
                        class="form-control"
                        readonly
                    >

                </div>


                <!-- EMAIL -->

                <div class="mb-4">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="accountEmail"
                        class="form-control"
                        readonly
                    >

                </div>


                <hr class="my-4">


                <!-- CHANGE PASSWORD -->

                <h4 class="fw-bold mb-3">
                    Change Password
                </h4>


                <div class="mb-3">

                    <label class="form-label">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        class="form-control"
                        placeholder="Enter current password"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm new password"
                    >

                </div>


                <button
                    class="btn dashboard-button w-100 mt-2"
                    onclick="changePassword()"
                >
                    Change Password
                </button>


                <p
                    id="message"
                    class="text-center mt-3"
                ></p>


                <hr class="my-4">


                <button
                    class="btn btn-danger w-100"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>

</div>


<script>

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");


if (!token) {

    window.location.href =
        "../login.html";
}


if (role !== "CUSTOMER") {

    alert("Access denied");

    window.location.href =
        "../login.html";
}


/* =========================
   LOAD ACCOUNT
========================= */

async function loadAccount() {

    try {

        const response =
            await fetch(
                "http://localhost/event_ticketing_system/api/auth/profile.php",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            document.getElementById(
                "message"
            ).innerText =
                data.message ||
                "Unable to load account.";

            return;
        }


        document.getElementById(
            "accountName"
        ).value =
            data.name;


        document.getElementById(
            "accountEmail"
        ).value =
            data.email;

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "message"
        ).innerText =
            "Unable to load account information.";
    }
}


/* =========================
   CHANGE PASSWORD
========================= */

async function changePassword() {

    const currentPassword =
        document.getElementById(
            "currentPassword"
        ).value;


    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    if (
        !currentPassword ||
        !newPassword ||
        !confirmPassword
    ) {

        message.innerText =
            "Please complete all password fields.";

        message.className =
            "text-danger text-center mt-3";

        return;
    }


    if (newPassword.length < 6) {

        message.innerText =
            "New password must be at least 6 characters.";

        message.className =
            "text-danger text-center mt-3";

        return;
    }


    if (
        newPassword !==
        confirmPassword
    ) {

        message.innerText =
            "New passwords do not match.";

        message.className =
            "text-danger text-center mt-3";

        return;
    }


    try {

        const response =
            await fetch(
                "http://localhost/event_ticketing_system/api/auth/change_password.php",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify({

                            current_password:
                                currentPassword,

                            new_password:
                                newPassword
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            message.innerText =
                data.message ||
                "Unable to change password.";

            message.className =
                "text-danger text-center mt-3";

            return;
        }


        message.innerText =
            "Password changed successfully.";

        message.className =
            "text-success text-center mt-3";


        document.getElementById(
            "currentPassword"
        ).value = "";


        document.getElementById(
            "newPassword"
        ).value = "";


        document.getElementById(
            "confirmPassword"
        ).value = "";

    }

    catch (error) {

        console.error(error);

        message.innerText =
            "Unable to connect to server.";

        message.className =
            "text-danger text-center mt-3";
    }
}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.clear();

    window.location.href =
        "../login.html";
}


loadAccount();

</script>

</body>

</html>
