<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - Book Event</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

<nav class="navbar custom-navbar">
    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub
        </a>

        <a
            href="events.html"
            class="btn logout-btn"
        >
            Back to Events
        </a>

    </div>
</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="booking-card">

                <h2 class="fw-bold mb-4">
                    Book Event
                </h2>

                <div class="mb-3">

                    <label class="form-label">
                        Event
                    </label>

                    <input
                        type="text"
                        id="eventName"
                        class="form-control"
                        readonly
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Ticket Price
                    </label>

                    <input
                        type="text"
                        id="ticketPrice"
                        class="form-control"
                        readonly
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        class="form-control"
                        min="1"
                        value="1"
                        required
                    >

                </div>


                <div class="total-box">

                    <span>
                        Total Price
                    </span>

                    <strong id="totalPrice">
                        RM 0.00
                    </strong>

                </div>


                <button
                    class="btn confirm-booking-btn w-100 mt-4"
                    onclick="confirmBooking()"
                >
                    Confirm Booking
                </button>


                <p
                    id="message"
                    class="text-center mt-3"
                ></p>

            </div>

        </div>

    </div>

</div>


<script>

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");

const eventId =
    localStorage.getItem("selected_event_id");

const eventName =
    localStorage.getItem("selected_event_name");

const ticketPrice =
    parseFloat(
        localStorage.getItem("selected_event_price")
    );


/* CHECK LOGIN */

if (!token) {

    window.location.href =
        "../login.html";
}


/* CUSTOMER ONLY */

if (role !== "CUSTOMER") {

    alert("Access denied");

    window.location.href =
        "../login.html";
}


/* CHECK EVENT */

if (
    !eventId ||
    !eventName ||
    isNaN(ticketPrice)
) {

    alert("No event selected");

    window.location.href =
        "events.html";
}


/* DISPLAY EVENT */

document.getElementById("eventName").value =
    eventName;

document.getElementById("ticketPrice").value =
    "RM " + ticketPrice.toFixed(2);


const quantityInput =
    document.getElementById("quantity");

const totalPrice =
    document.getElementById("totalPrice");

const message =
    document.getElementById("message");


/* UPDATE TOTAL */

function updateTotal() {

    let quantity =
        parseInt(quantityInput.value);

    if (
        isNaN(quantity) ||
        quantity < 1
    ) {

        quantity = 1;
    }

    const total =
        quantity * ticketPrice;

    totalPrice.innerText =
        "RM " + total.toFixed(2);
}


quantityInput.addEventListener(
    "input",
    updateTotal
);

updateTotal();


/* CONFIRM BOOKING */

async function confirmBooking() {

    const quantity =
        parseInt(quantityInput.value);


    if (
        isNaN(quantity) ||
        quantity < 1
    ) {

        message.innerText =
            "Quantity must be at least 1.";

        message.className =
            "text-danger text-center mt-3";

        return;
    }


    message.innerText =
        "Processing booking...";

    message.className =
        "text-secondary text-center mt-3";


    try {

        const response = await fetch(
            "http://localhost/event_ticketing_system/api/bookings/",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token
                },

                body: JSON.stringify({

                    event_id:
                        parseInt(eventId),

                    quantity:
                        quantity

                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            message.innerText =
                data.message ||
                "Booking failed.";

            message.className =
                "text-danger text-center mt-3";

            return;
        }


        message.innerText =
            "Booking successful! Total: RM " +
            parseFloat(
                data.total_price
            ).toFixed(2);

        message.className =
            "text-success text-center mt-3";


        /* REMOVE SELECTED EVENT */

        localStorage.removeItem(
            "selected_event_id"
        );

        localStorage.removeItem(
            "selected_event_name"
        );

        localStorage.removeItem(
            "selected_event_price"
        );


        setTimeout(function () {

            window.location.href =
                "bookings.html";

        }, 1500);

    }
    catch (error) {

        console.error(error);

        message.innerText =
            "Unable to complete booking.";

        message.className =
            "text-danger text-center mt-3";
    }
}

</script>

</body>
</html>
