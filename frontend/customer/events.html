<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="dashboard-body">


<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub
        </a>

        <a
            href="dashboard.html"
            class="btn logout-btn"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="mb-4">

        <h2 class="fw-bold">
            Upcoming Events
        </h2>

        <p class="text-muted">
            Find an event and reserve your tickets.
        </p>

    </div>


    <div
        id="eventContainer"
        class="row g-4"
    >
    </div>

</div>


<script>

const token =
    localStorage.getItem("token");

if (!token) {
    window.location.href = "../login.html";
}


async function loadEvents() {

    const container =
        document.getElementById("eventContainer");

    try {

        const response = await fetch(
            "http://localhost/event_ticketing_system/api/events/",
            {
                method: "GET",

                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        const events =
            await response.json();


        if (!response.ok) {

            container.innerHTML =
                `<p>${events.message}</p>`;

            return;
        }


        container.innerHTML = "";


        events.forEach(event => {

            container.innerHTML += `

            <div class="col-md-4">

                <div class="event-card">

                    <div class="event-image">
                        🎫
                    </div>

                    <div class="event-content">

                        <span class="event-status">
                            ${event.status}
                        </span>

                        <h4>
                            ${event.event_name}
                        </h4>

                        <p class="event-description">
                            ${event.description}
                        </p>

                        <div class="event-info">

                            <p>
                                📅 ${event.event_date}
                            </p>

                            <p>
                                🕒 ${event.start_time}
                            </p>

                            <p>
                                📍 ${event.venue_name}
                            </p>

                            <p>
                                🎟️ ${event.ticket_quantity}
                                tickets available
                            </p>

                        </div>

                        <div class="event-bottom">

                            <strong>
                                RM ${event.ticket_price}
                            </strong>

                            <button
                                class="btn book-button"
                                onclick="bookEvent(
                                    ${event.event_id},
                                    '${event.event_name}',
                                    ${event.ticket_price}
                                )"
                            >
                                Book Now
                            </button>

                        </div>

                    </div>

                </div>

            </div>

            `;

        });

    }
    catch (error) {

        container.innerHTML =
            "<p>Unable to load events.</p>";
    }
}


function bookEvent(
    eventId,
    eventName,
    price
) {

    localStorage.setItem(
        "selected_event_id",
        eventId
    );

    localStorage.setItem(
        "selected_event_name",
        eventName
    );

    localStorage.setItem(
        "selected_event_price",
        price
    );

    window.location.href =
        "book-event.html";
}


loadEvents();

</script>

</body>
</html>
