<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - My Bookings</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub
        </a>

        <a
            href="dashboard.html"
            class="btn logout-btn"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="mb-4">

        <h2 class="fw-bold">
            My Bookings
        </h2>

        <p class="text-muted">
            View your event reservations, booking status and digital tickets.
        </p>

    </div>


    <!-- FILTER -->

    <div class="row mb-4">

        <div class="col-md-4">

            <label
                for="statusFilter"
                class="form-label fw-bold"
            >
                Filter by Status
            </label>

            <select
                id="statusFilter"
                class="form-select"
                onchange="filterBookings()"
            >

                <option value="ALL">
                    All Bookings
                </option>

                <option value="CONFIRMED">
                    Confirmed
                </option>

                <option value="CANCELLED">
                    Cancelled
                </option>

            </select>

        </div>

    </div>


    <div id="bookingContainer">
    </div>

</div>


<script>

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");


let allBookings = [];


if (!token) {

    window.location.href =
        "../login.html";
}


if (role !== "CUSTOMER") {

    alert("Access denied");

    window.location.href =
        "../login.html";
}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings() {

    const container =
        document.getElementById(
            "bookingContainer"
        );


    try {

        const response =
            await fetch(
                "http://localhost/event_ticketing_system/api/bookings/",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const bookings =
            await response.json();


        if (!response.ok) {

            container.innerHTML = `

                <div class="alert alert-danger">

                    ${
                        bookings.message ||
                        "Unable to load bookings."
                    }

                </div>
            `;

            return;
        }


        /*
            Latest booking first
        */

        allBookings =
            bookings.sort(
                (a, b) =>
                    b.booking_id -
                    a.booking_id
            );


        displayBookings(
            allBookings
        );

    }

    catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="alert alert-danger">

                Unable to load bookings.

            </div>
        `;
    }
}


/* =========================
   DISPLAY BOOKINGS
========================= */

function displayBookings(
    bookings
) {

    const container =
        document.getElementById(
            "bookingContainer"
        );


    if (
        bookings.length === 0
    ) {

        container.innerHTML = `

            <div class="alert alert-info">

                No bookings found.

            </div>
        `;

        return;
    }


    container.innerHTML =
        "";


    bookings.forEach(
        booking => {


            /* DIGITAL TICKET */

            let ticketButton =
                "";


            if (
                booking.booking_status ===
                "CONFIRMED"
            ) {

                ticketButton = `

                    <button
                        class="btn btn-primary btn-sm mt-3"
                        onclick="viewTicket(
                            ${booking.booking_id}
                        )"
                    >
                        View Digital Ticket
                    </button>
                `;
            }


            /* CANCEL BUTTON */

            let cancelButton =
                "";


            if (
                booking.booking_status !==
                "CANCELLED"
            ) {

                cancelButton = `

                    <button
                        class="btn btn-danger btn-sm mt-2"
                        onclick="cancelBooking(
                            ${booking.booking_id}
                        )"
                    >
                        Cancel Booking
                    </button>
                `;
            }


            container.innerHTML += `

                <div class="booking-item">

                    <div>

                        <h4>
                            ${booking.event_name}
                        </h4>


                        <p>
                            Booking ID:
                            #${booking.booking_id}
                        </p>


                        <p>
                            Event Date:
                            ${booking.event_date}
                        </p>


                        <p>
                            Venue:
                            ${booking.venue_name}
                        </p>


                        <p>
                            Quantity:
                            ${booking.quantity}
                        </p>


                        <p>
                            Total:
                            RM ${parseFloat(
                                booking.total_price
                            ).toFixed(2)}
                        </p>


                        <p>
                            Booking Date:
                            ${booking.booking_date}
                        </p>

                    </div>


                    <div class="booking-actions">

                        <span
                            class="booking-status
                            ${booking.booking_status.toLowerCase()}"
                        >
                            ${booking.booking_status}
                        </span>


                        ${ticketButton}


                        ${cancelButton}

                    </div>

                </div>
            `;

        }
    );
}


/* =========================
   FILTER BOOKINGS
========================= */

function filterBookings() {

    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    if (
        status === "ALL"
    ) {

        displayBookings(
            allBookings
        );

        return;
    }


    const filteredBookings =
        allBookings.filter(
            booking =>
                booking.booking_status ===
                status
        );


    displayBookings(
        filteredBookings
    );
}


/* =========================
   VIEW DIGITAL TICKET
========================= */

function viewTicket(
    bookingId
) {

    localStorage.setItem(
        "selected_booking_id",
        bookingId
    );


    window.location.href =
        "ticket.html";
}


/* =========================
   CANCEL BOOKING
========================= */

async function cancelBooking(
    bookingId
) {

    const confirmCancel =
        confirm(
            "Are you sure you want to cancel this booking?"
        );


    if (!confirmCancel) {

        return;
    }


    try {

        const response =
            await fetch(
                "http://localhost/event_ticketing_system/api/bookings/?id="
                + bookingId,
                {
                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify({

                            booking_status:
                                "CANCELLED"
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to cancel booking."
            );

            return;
        }


        alert(
            "Booking cancelled successfully"
        );


        loadBookings();

    }

    catch (error) {

        console.error(error);


        alert(
            "Unable to cancel booking"
        );
    }
}


/* =========================
   START
========================= */

loadBookings();

</script>

</body>

</html>
