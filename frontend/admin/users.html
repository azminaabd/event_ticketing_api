<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - Manage Users</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>


<body class="dashboard-body">


<!-- ========================================
     NAVBAR
======================================== -->

<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub Admin
        </a>

        <a
            href="dashboard.html"
            class="btn logout-btn"
        >
            Dashboard
        </a>

    </div>

</nav>


<!-- ========================================
     MAIN CONTENT
======================================== -->

<div class="container py-5">


    <!-- TITLE -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h2 class="fw-bold">
                Manage Users
            </h2>

            <p class="text-muted">
                Create, update and remove system users.
            </p>

        </div>


        <button
            class="btn dashboard-button"
            data-bs-toggle="modal"
            data-bs-target="#userModal"
            onclick="openAddUser()"
        >
            + Add User
        </button>

    </div>


    <!-- ========================================
         SEARCH AND FILTER
    ======================================== -->

    <div class="row g-3 mb-4">


        <!-- SEARCH -->

        <div class="col-md-8">

            <input
                type="text"
                id="searchUser"
                class="form-control"
                placeholder="Search by name or email..."
                oninput="filterUsers()"
            >

        </div>


        <!-- ROLE FILTER -->

        <div class="col-md-4">

            <select
                id="roleFilter"
                class="form-select"
                onchange="filterUsers()"
            >

                <option value="">
                    All Roles
                </option>

                <option value="ADMIN">
                    Admin
                </option>

                <option value="ORGANISER">
                    Organiser
                </option>

                <option value="CUSTOMER">
                    Customer
                </option>

            </select>

        </div>

    </div>


    <!-- ========================================
         USER TABLE
    ======================================== -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Created
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                    </thead>


                    <tbody id="userTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>



<!-- ========================================
     USER MODAL
======================================== -->

<div
    class="modal fade"
    id="userModal"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content">


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle"
                >
                    Add User
                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                >
                </button>

            </div>


            <!-- MODAL BODY -->

            <div class="modal-body">


                <!-- USER ID -->

                <input
                    type="hidden"
                    id="userId"
                >


                <!-- NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        id="userName"
                        class="form-control"
                        placeholder="Enter user name"
                    >

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        class="form-control"
                        placeholder="Enter email"
                    >

                </div>


                <!-- PASSWORD -->

                <div
                    class="mb-3"
                    id="passwordGroup"
                >

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="userPassword"
                        class="form-control"
                        placeholder="Enter password"
                    >

                </div>


                <!-- ROLE -->

                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>


                    <select
                        id="userRole"
                        class="form-select"
                    >

                        <option value="ADMIN">
                            Admin
                        </option>

                        <option value="ORGANISER">
                            Organiser
                        </option>

                        <option value="CUSTOMER">
                            Customer
                        </option>

                    </select>

                </div>


                <!-- MESSAGE -->

                <p
                    id="formMessage"
                    class="text-center"
                >
                </p>

            </div>


            <!-- MODAL FOOTER -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn dashboard-button"
                    onclick="saveUser()"
                >
                    Save
                </button>

            </div>

        </div>

    </div>

</div>



<!-- ========================================
     BOOTSTRAP
======================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<script>


/* ========================================
   LOGIN CHECK
======================================== */

const token =
    localStorage.getItem(
        "token"
    );


const role =
    localStorage.getItem(
        "role"
    );


if (!token) {

    window.location.href =
        "../login.html";
}


if (role !== "ADMIN") {

    alert(
        "Access denied"
    );

    window.location.href =
        "../login.html";
}



/* ========================================
   API
======================================== */

const apiUrl =
    "http://localhost/event_ticketing_system/api/users/";


let allUsers = [];



/* ========================================
   LOAD USERS
======================================== */

async function loadUsers() {

    try {

        const response =
            await fetch(
                apiUrl,
                {

                    method:
                        "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const users =
            await response.json();


        if (!response.ok) {

            alert(
                users.message ||
                "Unable to load users"
            );

            return;
        }


        allUsers =
            users;


        displayUsers(
            allUsers
        );

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Unable to load users"
        );
    }
}



/* ========================================
   DISPLAY USERS
======================================== */

function displayUsers(
    users
) {

    const tbody =
        document.getElementById(
            "userTableBody"
        );


    tbody.innerHTML =
        "";


    if (
        users.length === 0
    ) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="text-center text-muted py-4"
                >

                    No users found.

                </td>

            </tr>

        `;

        return;
    }


    users.forEach(
        user => {


            /* =========================
               ROLE BADGE
            ========================= */

            let roleClass =
                "bg-primary";


            if (
                user.role ===
                "ADMIN"
            ) {

                roleClass =
                    "bg-danger";
            }


            else if (
                user.role ===
                "ORGANISER"
            ) {

                roleClass =
                    "bg-warning text-dark";
            }


            else if (
                user.role ===
                "CUSTOMER"
            ) {

                roleClass =
                    "bg-success";
            }



            /* =========================
               EDIT BUTTON

               CUSTOMER DOES NOT HAVE
               EDIT BUTTON
            ========================= */

            let editButton =
                "";


            if (
                user.role !==
                "CUSTOMER"
            ) {

                editButton = `

                    <button
                        class="btn btn-warning btn-sm me-1"
                        onclick='editUser(
                            ${JSON.stringify(user)}
                        )'
                    >
                        Edit
                    </button>

                `;
            }



            /* =========================
               DISPLAY USER ROW
            ========================= */

            tbody.innerHTML += `

                <tr>


                    <td>

                        ${user.user_id}

                    </td>


                    <td>

                        ${user.name}

                    </td>


                    <td>

                        ${user.email}

                    </td>


                    <td>

                        <span
                            class="badge ${roleClass}"
                        >

                            ${user.role}

                        </span>

                    </td>


                    <td>

                        ${user.created_at}

                    </td>


                    <td>

                        ${editButton}


                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteUser(
                                ${user.user_id}
                            )"
                        >
                            Delete
                        </button>

                    </td>


                </tr>

            `;

        }
    );
}



/* ========================================
   FILTER USERS
======================================== */

function filterUsers() {

    const search =
        document.getElementById(
            "searchUser"
        )
        .value
        .toLowerCase()
        .trim();


    const selectedRole =
        document.getElementById(
            "roleFilter"
        ).value;


    const filteredUsers =
        allUsers.filter(
            user => {


                const userName =
                    user.name
                    .toLowerCase();


                const userEmail =
                    user.email
                    .toLowerCase();


                const matchesSearch =

                    userName.includes(
                        search
                    )

                    ||

                    userEmail.includes(
                        search
                    );


                const matchesRole =

                    selectedRole === ""

                    ||

                    user.role ===
                    selectedRole;


                return (

                    matchesSearch

                    &&

                    matchesRole

                );

            }
        );


    displayUsers(
        filteredUsers
    );
}



/* ========================================
   OPEN ADD USER
======================================== */

function openAddUser() {


    document.getElementById(
        "modalTitle"
    ).innerText =
        "Add User";


    document.getElementById(
        "userId"
    ).value =
        "";


    document.getElementById(
        "userName"
    ).value =
        "";


    document.getElementById(
        "userEmail"
    ).value =
        "";


    document.getElementById(
        "userPassword"
    ).value =
        "";


    document.getElementById(
        "userRole"
    ).value =
        "CUSTOMER";


    document.getElementById(
        "passwordGroup"
    ).style.display =
        "block";


    document.getElementById(
        "formMessage"
    ).innerText =
        "";
}



/* ========================================
   EDIT USER
======================================== */

function editUser(
    user
) {


    /*
        Additional protection:
        Customer details cannot be edited.
    */

    if (
        user.role ===
        "CUSTOMER"
    ) {

        alert(
            "Customer details cannot be edited."
        );

        return;
    }


    document.getElementById(
        "modalTitle"
    ).innerText =
        "Edit User";


    document.getElementById(
        "userId"
    ).value =
        user.user_id;


    document.getElementById(
        "userName"
    ).value =
        user.name;


    document.getElementById(
        "userEmail"
    ).value =
        user.email;


    document.getElementById(
        "userRole"
    ).value =
        user.role;


    /*
        Hide password when editing
    */

    document.getElementById(
        "passwordGroup"
    ).style.display =
        "none";


    document.getElementById(
        "formMessage"
    ).innerText =
        "";


    const modal =
        new bootstrap.Modal(

            document.getElementById(
                "userModal"
            )

        );


    modal.show();
}



/* ========================================
   SAVE USER
======================================== */

async function saveUser() {


    const id =
        document.getElementById(
            "userId"
        ).value;


    const name =
        document.getElementById(
            "userName"
        )
        .value
        .trim();


    const email =
        document.getElementById(
            "userEmail"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "userPassword"
        ).value;


    const userRole =
        document.getElementById(
            "userRole"
        ).value;


    const message =
        document.getElementById(
            "formMessage"
        );



    /* ========================================
       VALIDATION
    ======================================== */

    if (
        !name ||
        !email ||
        (
            !id &&
            !password
        )
    ) {

        message.innerText =
            "Please complete all required fields.";


        message.className =
            "text-danger text-center";


        return;
    }


    if (
        !id &&
        password.length < 6
    ) {

        message.innerText =
            "Password must be at least 6 characters.";


        message.className =
            "text-danger text-center";


        return;
    }



    let method;

    let url;

    let body;



    /* ========================================
       EDIT USER
    ======================================== */

    if (id) {


        /*
            Get the original user
        */

        const originalUser =
            allUsers.find(
                user =>
                    user.user_id == id
            );


        /*
            Prevent customer editing
        */

        if (
            originalUser &&
            originalUser.role ===
            "CUSTOMER"
        ) {

            message.innerText =
                "Customer details cannot be edited.";


            message.className =
                "text-danger text-center";


            return;
        }


        method =
            "PUT";


        url =
            apiUrl +
            "?id=" +
            id;


        body = {

            name:
                name,

            email:
                email,

            role:
                userRole
        };

    }



    /* ========================================
       ADD USER
    ======================================== */

    else {


        method =
            "POST";


        url =
            apiUrl;


        body = {

            name:
                name,

            email:
                email,

            password:
                password,

            role:
                userRole

        };

    }



    try {

        const response =
            await fetch(
                url,
                {

                    method:
                        method,


                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },


                    body:
                        JSON.stringify(
                            body
                        )
                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            message.innerText =
                data.message ||
                "Unable to save user.";


            message.className =
                "text-danger text-center";


            return;
        }


        message.innerText =
            data.message ||
            "User saved successfully.";


        message.className =
            "text-success text-center";


        setTimeout(

            function () {


                const modalElement =
                    document.getElementById(
                        "userModal"
                    );


                const modal =
                    bootstrap.Modal.getInstance(
                        modalElement
                    );


                if (modal) {

                    modal.hide();
                }


                loadUsers();

            },

            700
        );

    }

    catch (error) {

        console.error(
            error
        );


        message.innerText =
            "Unable to connect to server.";


        message.className =
            "text-danger text-center";
    }
}



/* ========================================
   DELETE USER
======================================== */

async function deleteUser(
    id
) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this user?"
        );


    if (
        !confirmDelete
    ) {

        return;
    }


    try {

        const response =
            await fetch(

                apiUrl +
                "?id=" +
                id,

                {

                    method:
                        "DELETE",


                    headers: {

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            alert(
                data.message ||
                "Unable to delete user"
            );

            return;
        }


        alert(
            "User deleted successfully"
        );


        loadUsers();

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Unable to delete user"
        );
    }
}



/* ========================================
   LOAD PAGE
======================================== */

loadUsers();


</script>


</body>

</html>
