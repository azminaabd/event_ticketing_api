<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub Admin
        </a>

        <div class="d-flex align-items-center gap-3">

            <span
                id="adminName"
                class="text-white"
            ></span>

            <button
                class="btn logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>

</nav>


<section class="admin-hero">

    <div class="container">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Manage users, venues and system records.
        </p>

    </div>

</section>


<section class="container dashboard-section">

    <div class="row g-4">

        <div class="col-md-4">

            <div class="dashboard-card">

                <div class="dashboard-icon">
                    👥
                </div>

                <h4>
                    Manage Users
                </h4>

                <p>
                    View, create, update and delete
                    system users.
                </p>

                <a
                    href="users.html"
                    class="btn dashboard-button"
                >
                    Manage Users
                </a>

            </div>

        </div>


        <div class="col-md-4">

            <div class="dashboard-card">

                <div class="dashboard-icon">
                    🏢
                </div>

                <h4>
                    Manage Venues
                </h4>

                <p>
                    Create and maintain venue
                    information.
                </p>

                <a
                    href="venues.html"
                    class="btn dashboard-button"
                >
                    Manage Venues
                </a>

            </div>

        </div>


        <div class="col-md-4">

            <div class="dashboard-card">

                <div class="dashboard-icon">
                    📊
                </div>

                <h4>
                    System Records
                </h4>

                <p>
                    View event and booking information.
                </p>

                <a
                    href="records.html"
                    class="btn dashboard-button"
                    >
                        View Records
                </a>

            </div>

        </div>

    </div>

</section>


<script>

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");

const name =
    localStorage.getItem("user_name");


if (!token) {

    window.location.href =
        "../login.html";
}


if (role !== "ADMIN") {

    alert("Access denied");

    window.location.href =
        "../login.html";
}


document.getElementById(
    "adminName"
).innerText =
    "Hi, " + name;


function logout() {

    localStorage.clear();

    window.location.href =
        "../login.html";
}

</script>

</body>
</html>
