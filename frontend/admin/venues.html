<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EventHub - Manage Venues
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="dashboard-body">


<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub Admin
        </a>


        <a
            href="dashboard.html"
            class="btn logout-btn"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container py-5">


    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h2 class="fw-bold">
                Manage Venues
            </h2>

            <p class="text-muted">
                Add, update and manage event venues.
            </p>

        </div>


        <button
            class="btn dashboard-button"
            data-bs-toggle="modal"
            data-bs-target="#venueModal"
            onclick="openAddVenue()"
        >
            + Add Venue
        </button>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Venue Name</th>

                            <th>Location</th>

                            <th>Capacity</th>

                            <th>Status</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="venueTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- VENUE MODAL -->

<div
    class="modal fade"
    id="venueModal"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="venueModalTitle"
                >
                    Add Venue
                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                >
                </button>

            </div>


            <div class="modal-body">


                <input
                    type="hidden"
                    id="venueId"
                >


                <div class="mb-3">

                    <label class="form-label">
                        Venue Name
                    </label>

                    <input
                        type="text"
                        id="venueName"
                        class="form-control"
                        placeholder="Enter venue name"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        id="venueLocation"
                        class="form-control"
                        placeholder="Enter location"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Capacity
                    </label>

                    <input
                        type="number"
                        id="venueCapacity"
                        class="form-control"
                        min="1"
                        placeholder="Enter capacity"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>


                    <select
                        id="venueStatus"
                        class="form-select"
                    >

                        <option value="ACTIVE">
                            Available
                        </option>

                        <option value="INACTIVE">
                            Unavailable
                        </option>

                    </select>

                </div>


                <p
                    id="venueMessage"
                    class="text-center"
                >
                </p>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn dashboard-button"
                    onclick="saveVenue()"
                >
                    Save Venue
                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>


const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");


if (!token) {

    window.location.href =
        "../login.html";
}


if (role !== "ADMIN") {

    alert("Access denied");

    window.location.href =
        "../login.html";
}


const apiUrl =
    "http://localhost/event_ticketing_system/api/venues/";


/* =============================
   LOAD VENUES
============================= */

async function loadVenues() {

    const tbody =
        document.getElementById(
            "venueTableBody"
        );


    try {

        const response =
            await fetch(
                apiUrl,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const venues =
            await response.json();


        if (!response.ok) {

            alert(
                venues.message ||
                "Unable to load venues"
            );

            return;
        }


        tbody.innerHTML = "";


        if (venues.length === 0) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="text-center text-muted py-4"
                    >
                        No venues found.
                    </td>

                </tr>
            `;

            return;
        }


        venues.forEach(venue => {


            let statusClass = "";

            let statusText = "";


            if (
                venue.status ===
                "ACTIVE"
            ) {

                statusClass =
                    "bg-success";

                statusText =
                    "AVAILABLE";
            }

            else {

                statusClass =
                    "bg-secondary";

                statusText =
                    "UNAVAILABLE";
            }


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${venue.venue_id}
                    </td>

                    <td>
                        ${venue.venue_name}
                    </td>

                    <td>
                        ${venue.location}
                    </td>

                    <td>
                        ${venue.capacity}
                    </td>

                    <td>

                        <span
                            class="badge ${statusClass}"
                        >
                            ${statusText}
                        </span>

                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm me-1"
                            onclick='editVenue(
                                ${JSON.stringify(venue)}
                            )'
                        >
                            Edit
                        </button>


                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteVenue(
                                ${venue.venue_id}
                            )"
                        >
                            Delete
                        </button>

                    </td>

                </tr>
            `;

        });

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to connect to server"
        );
    }
}


/* =============================
   OPEN ADD VENUE
============================= */

function openAddVenue() {

    document.getElementById(
        "venueModalTitle"
    ).innerText =
        "Add Venue";


    document.getElementById(
        "venueId"
    ).value = "";


    document.getElementById(
        "venueName"
    ).value = "";


    document.getElementById(
        "venueLocation"
    ).value = "";


    document.getElementById(
        "venueCapacity"
    ).value = "";


    document.getElementById(
        "venueStatus"
    ).value =
        "ACTIVE";


    document.getElementById(
        "venueMessage"
    ).innerText = "";
}


/* =============================
   EDIT VENUE
============================= */

function editVenue(venue) {

    document.getElementById(
        "venueModalTitle"
    ).innerText =
        "Edit Venue";


    document.getElementById(
        "venueId"
    ).value =
        venue.venue_id;


    document.getElementById(
        "venueName"
    ).value =
        venue.venue_name;


    document.getElementById(
        "venueLocation"
    ).value =
        venue.location;


    document.getElementById(
        "venueCapacity"
    ).value =
        venue.capacity;


    document.getElementById(
        "venueStatus"
    ).value =
        venue.status;


    document.getElementById(
        "venueMessage"
    ).innerText = "";


    const modal =
        new bootstrap.Modal(
            document.getElementById(
                "venueModal"
            )
        );


    modal.show();
}


/* =============================
   SAVE VENUE
============================= */

async function saveVenue() {

    const id =
        document.getElementById(
            "venueId"
        ).value;


    const venueName =
        document.getElementById(
            "venueName"
        ).value.trim();


    const venueLocation =
        document.getElementById(
            "venueLocation"
        ).value.trim();


    const capacity =
        parseInt(
            document.getElementById(
                "venueCapacity"
            ).value
        );


    const status =
        document.getElementById(
            "venueStatus"
        ).value;


    const message =
        document.getElementById(
            "venueMessage"
        );


    if (
        !venueName ||
        !venueLocation ||
        isNaN(capacity) ||
        capacity < 1
    ) {

        message.innerText =
            "Please complete all fields correctly.";

        message.className =
            "text-danger text-center";

        return;
    }


    let method;

    let url;


    if (id) {

        method =
            "PUT";

        url =
            apiUrl +
            "?id=" +
            id;
    }

    else {

        method =
            "POST";

        url =
            apiUrl;
    }


    try {

        const response =
            await fetch(
                url,
                {
                    method: method,

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify({

                            venue_name:
                                venueName,

                            location:
                                venueLocation,

                            capacity:
                                capacity,

                            status:
                                status
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            message.innerText =
                data.message ||
                "Unable to save venue.";

            message.className =
                "text-danger text-center";

            return;
        }


        message.innerText =
            data.message ||
            "Venue saved successfully.";

        message.className =
            "text-success text-center";


        setTimeout(

            function () {

                const modalElement =
                    document.getElementById(
                        "venueModal"
                    );


                const modal =
                    bootstrap.Modal.getInstance(
                        modalElement
                    );


                if (modal) {

                    modal.hide();
                }


                loadVenues();

            },

            700
        );

    }

    catch (error) {

        console.error(error);

        message.innerText =
            "Unable to connect to server.";

        message.className =
            "text-danger text-center";
    }
}


/* =============================
   DELETE VENUE
============================= */

async function deleteVenue(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this venue?"
        );


    if (!confirmDelete) {

        return;
    }


    try {

        const response =
            await fetch(
                apiUrl +
                "?id=" +
                id,
                {
                    method:
                        "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to delete venue"
            );

            return;
        }


        alert(
            "Venue deleted successfully"
        );


        loadVenues();

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to delete venue"
        );
    }
}


/* =============================
   START
============================= */

loadVenues();


</script>


</body>

</html>
