<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - Customer Bookings</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="dashboard-body">

<nav class="navbar custom-navbar">

    <div class="container">

        <a
            class="navbar-brand brand-name"
            href="dashboard.html"
        >
            EventHub Organiser
        </a>

        <a
            href="dashboard.html"
            class="btn logout-btn"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="mb-4">

        <h2 class="fw-bold">
            Customer Bookings
        </h2>

        <p class="text-muted">
            View booking records made by customers.
        </p>

    </div>


    <!-- SUMMARY -->

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="record-card">

                <h6>
                    Total Bookings
                </h6>

                <h2 id="totalBookings">
                    0
                </h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="record-card">

                <h6>
                    Confirmed
                </h6>

                <h2 id="confirmedBookings">
                    0
                </h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="record-card">

                <h6>
                    Cancelled
                </h6>

                <h2 id="cancelledBookings">
                    0
                </h2>

            </div>

        </div>

    </div>


    <!-- BOOKINGS TABLE -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Event</th>
                        <th>Quantity</th>
                        <th>Total Price</th>
                        <th>Status</th>
                        <th>Booking Date</th>
                    </tr>

                    </thead>


                    <tbody id="bookingTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");


if (!token) {

    window.location.href =
        "../login.html";
}


if (
    role !== "ORGANISER" &&
    role !== "ADMIN"
) {

    alert("Access denied");

    window.location.href =
        "../login.html";
}


const bookingApi =
    "http://localhost/event_ticketing_system/api/bookings/";


async function loadBookings() {

    try {

        const response =
            await fetch(
                bookingApi,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const bookings =
            await response.json();


        if (!response.ok) {

            alert(
                bookings.message ||
                "Unable to load bookings"
            );

            return;
        }


        const tbody =
            document.getElementById(
                "bookingTableBody"
            );


        tbody.innerHTML = "";


        let confirmed = 0;
        let cancelled = 0;


        bookings.forEach(booking => {

            let statusClass =
                "bg-secondary";


            if (
                booking.booking_status ===
                "CONFIRMED"
            ) {

                statusClass =
                    "bg-success";

                confirmed++;
            }


            if (
                booking.booking_status ===
                "PENDING"
            ) {

                statusClass =
                    "bg-warning text-dark";
            }


            if (
                booking.booking_status ===
                "CANCELLED"
            ) {

                statusClass =
                    "bg-danger";

                cancelled++;
            }


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${booking.booking_id}
                    </td>

                    <td>
                        ${booking.customer_name}
                    </td>

                    <td>
                        ${booking.event_name}
                    </td>

                    <td>
                        ${booking.quantity}
                    </td>

                    <td>
                        RM ${parseFloat(
                            booking.total_price
                        ).toFixed(2)}
                    </td>

                    <td>

                        <span
                            class="badge ${statusClass}"
                        >
                            ${booking.booking_status}
                        </span>

                    </td>

                    <td>
                        ${booking.booking_date}
                    </td>

                </tr>
            `;

        });


        document.getElementById(
            "totalBookings"
        ).innerText =
            bookings.length;


        document.getElementById(
            "confirmedBookings"
        ).innerText =
            confirmed;


        document.getElementById(
            "cancelledBookings"
        ).innerText =
            cancelled;

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to connect to server"
        );
    }
}


loadBookings();

</script>

</body>
</html>
