<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

<div class="login-wrapper">

    <div class="login-left">

        <div class="brand">
            <h1>EventHub</h1>
            <p>Discover. Book. Experience.</p>
        </div>

        <div class="hero-text">
            <h2>Find and book your next event.</h2>
            <p>
                Browse events, reserve tickets, manage bookings
                and enjoy a smooth event experience.
            </p>
        </div>

    </div>

    <div class="login-right">

        <div class="login-card">

            <h3>Welcome Back</h3>

            <p class="subtitle">
                Login to your EventHub account
            </p>

            <form id="loginForm">

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control custom-input"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control custom-input"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn login-btn w-100"
                >
                    Login
                </button>

            </form>

            <p
                id="message"
                class="text-center mt-3"
            ></p>

            <div class="login-footer">
                Event Ticketing & Venue Booking System
            </div>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
