<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign In | Eventra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-bg">
  <main class="auth-card">
    <section class="auth-left">
      <div class="brand-row">
        <a class="logo" href="index.html">Eventra</a>
        <span class="brand-subtitle">Event Ticketing & Venue Booking</span>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <h1>Sign In</h1>
        <p class="auth-copy">
          Access your dashboard based on your account role.
        </p>

        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
          </div>
          <p class="field-error"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
            <button type="button" class="toggle-pw" onclick="togglePw(this)">
              Show
            </button>
          </div>
          <p class="field-error"></p>
        </div>

        <button id="submitBtn" class="btn" type="submit">Sign In</button>
        <p class="alt-link">
          New customer? <a href="signup.html">Create an account</a>
        </p>
      </form>
    </section>

    <section class="auth-right">
      <div class="auth-art">
        <span class="art-kicker">EVENTRA</span>
        <h2>Discover.<br />Book.<br />Experience.</h2>
        <p>One system for administrators, organisers and customers.</p>
      </div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document
      .getElementById('loginForm')
      .addEventListener('submit', async event => {
        event.preventDefault()

        const email = document.getElementById('email')
        const password = document.getElementById('password')
        const valid = [
          setError(
            email,
            /^\S+@\S+\.\S+$/.test(email.value.trim())
              ? ''
              : 'Enter a valid email address.'
          ),
          setError(password, password.value ? '' : 'Enter your password.')
        ].every(Boolean)

        if (!valid) return

        const button = document.getElementById('submitBtn')
        setButtonLoading(button, true)

        try {
          const payload = await apiFetch(ENDPOINTS.login, {
            method: 'POST',
            body: JSON.stringify({
              email: email.value.trim(),
              password: password.value
            })
          })

          const user = saveSession(payload, email.value.trim())
          toast(`Welcome, ${user.name || 'user'}!`, 'success')
          setTimeout(() => redirectByRole(user.role), 350)
        } finally {
          setButtonLoading(button, false)
        }
      })
  </script>
</body>

</html>
